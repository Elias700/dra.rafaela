<section id="depoimentos" class="section testimonials" aria-labelledby="depoimentos-title">
  <div class="container">
    <div class="testimonials__head">
      <div class="section-head">
        <h2 id="depoimentos-title" appSplitText="h">{{ config.title }}</h2>
      </div>
      @if (googleUrl) {
        <a class="text-link" [href]="googleUrl" target="_blank" rel="noopener" appReveal>
          {{ config.seeAllLabel }}
          <span class="visually-hidden">(abre em nova aba)</span>
          <app-icon name="arrow-up-right" />
        </a>
      }
    </div>

    <div
      class="slider"
      role="group"
      aria-roledescription="carrossel"
      aria-label="Depoimentos de pacientes"
      appReveal
      (mouseenter)="setInteracting(true)"
      (mouseleave)="setInteracting(false)"
      (focusin)="setInteracting(true)"
      (focusout)="onFocusOut($event)"
      (keydown)="onKeydown($event)"
    >
      <div
        class="slider__viewport"
        [attr.aria-live]="running() ? 'off' : 'polite'"
        (pointerdown)="onPointerDown($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
      >
        @for (item of items; track item.name; let i = $index) {
          <div
            class="slide"
            [class.is-active]="i === index()"
            role="group"
            aria-roledescription="slide"
            [attr.aria-label]="i + 1 + ' de ' + items.length"
            [attr.aria-hidden]="i === index() ? null : 'true'"
            [attr.inert]="i === index() ? null : ''"
          >
            <figure class="slide__figure">
              <span class="slide__mark" aria-hidden="true">“</span>
              <blockquote class="slide__quote">
                <p>{{ item.text }}</p>
              </blockquote>
              <figcaption class="slide__author">
                <span class="slide__name">{{ item.name }}</span>
                <span class="slide__source">
                  {{ config.sourceLabel }}
                </span>
              </figcaption>
            </figure>
          </div>
        }
      </div>

      <div class="slider__controls">
        <button
          type="button"
          class="round-btn"
          (click)="toggleAutoplay()"
          [attr.aria-label]="
            autoplay() ? 'Pausar a troca automática' : 'Reproduzir a troca automática'
          "
        >
          <svg class="round-btn__arc" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="30.5" pathLength="100" />
          </svg>
          <app-icon [name]="autoplay() ? 'pause' : 'play'" />
        </button>

        <div class="slider__progress" aria-hidden="true">
          <span class="slider__count">{{ pad(index() + 1) }}</span>
          <span class="slider__track">
            @for (k of cycle(); track k) {
              <span
                class="slider__bar"
                [class.is-running]="running()"
                (animationend)="next()"
              ></span>
            }
          </span>
          <span class="slider__count slider__count--total">{{ pad(items.length) }}</span>
        </div>

        <div class="slider__arrows">
          <button type="button" class="round-btn" (click)="prev()" aria-label="Depoimento anterior">
            <svg class="round-btn__arc" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="30.5" pathLength="100" />
            </svg>
            <app-icon name="chevron-left" />
          </button>
          <button type="button" class="round-btn" (click)="next()" aria-label="Próximo depoimento">
            <svg class="round-btn__arc" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="30.5" pathLength="100" />
            </svg>
            <app-icon name="chevron-right" />
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
