<section id="duvidas" class="section faq" aria-labelledby="duvidas-title">
  <div class="container faq__grid">
    <div class="section-head faq__head">
      <h2 id="duvidas-title" appSplitText="h">{{ intro.title }}</h2>
    </div>

    <ul class="faq__list" role="list" appReveal revealChildren="li">
      @for (item of items; track item.question; let i = $index) {
        <li class="faq__item" [class.is-open]="open().has(i)">
          <h3 class="faq__q">
            <button
              type="button"
              class="faq__button"
              [id]="'faq-q-' + i"
              [attr.aria-expanded]="open().has(i)"
              [attr.aria-controls]="'faq-a-' + i"
              (click)="toggle(i)"
            >
              <span>{{ item.question }}</span>
              <span class="faq__icon" aria-hidden="true"><app-icon name="plus" /></span>
            </button>
          </h3>
          <div
            class="faq__panel"
            [id]="'faq-a-' + i"
            role="region"
            [attr.aria-labelledby]="'faq-q-' + i"
          >
            <div class="faq__panel-inner">
              <p class="faq__a">{{ item.answer }}</p>
            </div>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
